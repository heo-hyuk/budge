name = "budget-monthly-tax-reporter"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# fetch 핸들러가 없는 크론 전용 워커라 공개 HTTP 엔드포인트가 불필요 — 노출 면 최소화
workers_dev = false
# @block65/webcrypto-web-push가 Node용 폴백 경로로 node:crypto를 동적 import함
# (Workers에는 Web Crypto가 기본 있어 실제로는 안 타는 분기지만, 번들러 경고 방지 겸
# 안전하게 활성화)
compatibility_flags = ["nodejs_compat"]

[triggers]
# 매일 UTC 15시 = 한국시간(UTC+9) 자정. Cloudflare Cron은 "매월 말일"을 직접
# 표현할 수 없어(표준 5필드 cron, "L" 미지원) card-settlement-notifier와 동일하게
# 매일 실행하되 src/index.ts에서 "오늘이 KST 기준 1일인지"를 체크한다 — 그 시각이
# 정확히 "전달 말일 자정"과 같은 순간이므로 결과적으로 매월 말일 자정에만 동작한다
crons = ["0 15 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "budget-db"
database_id = "ff31284d-4e34-4a03-a99c-313cc330d7d0"

[vars]
# VAPID 공개키/subject는 비밀정보가 아니라 평문 변수로 둠(src/lib/pushConfig.ts와
# 동일한 공개키여야 함). 비공개키(VAPID_PRIVATE_KEY)는 `wrangler secret put`으로만 등록
VAPID_PUBLIC_KEY = "BAYaCkdYCPduSmypoCI0Wt4YL9rz6wiNo8EJdbpMZovN28TsIgr-BuYjBgNIHpHu1Ulj2L5gRkF_zFO3wAkc3U8"
VAPID_SUBJECT = "https://budget-3wb.pages.dev"
